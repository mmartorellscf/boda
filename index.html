<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natalia &amp; Marçal · 3 de juliol de 2027</title>
<meta name="description" content="Dissabte, 3 de juliol de 2027 · Mas de les Moreres, Cornudella de Montsant (Priorat)">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Natalia &amp; Marçal">
<meta property="og:description" content="Dissabte, 3 de juliol de 2027 · Mas de les Moreres, Cornudella de Montsant">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1Rs5YnpCArYb64omxe8YgoyfVj4ox_m7s=w1200">
<meta name="theme-color" content="#FAF6ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital@1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<style>
:root{--vi:#4D5D3F;--ol:#8E9C74;--cru:#FAF6ED;--lli:#EADFC8;--or:#DC6A28;--ort:#B4500F;--pr:#F2954F;--gr:#9C2B33;--ro:#D6A3A6;--ink:#27311F;--line:#D9CDB3;--pap:#F3ECDB;
--tit:'Playfair Display',Georgia,'Times New Roman',serif;--txt:'Cormorant Garamond',Georgia,serif;--lab:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--gut:22px;--rail:46px}
@property --p{syntax:'<percentage>';inherits:false;initial-value:130%}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cru);color:var(--vi);font-family:var(--txt);font-size:20px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ol,ul{margin:0;padding:0}ol,ul{list-style:none}
a{color:inherit}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
[hidden]{display:none!important}
.lab{font-family:var(--lab);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.acc{color:var(--ort)}
.tt{font-family:var(--tit);font-style:italic;font-weight:400;font-size:clamp(46px,13vw,72px);line-height:1.05}
.tt em{font-style:italic;color:var(--ort)}
.lead{font-size:21px;line-height:1.3;max-width:34em}
.note{font-family:var(--lab);font-size:13px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:26px;border:0;background:var(--vi);color:var(--cru);font-family:var(--lab);font-size:16px;font-weight:500;text-decoration:none;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--vi);border:1px solid var(--vi)}
.btn.sm{min-height:44px;padding:0 18px;font-size:14px}

/* Barra superior */
#top{position:fixed;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) var(--gut) 10px;transition:background .3s,box-shadow .3s}
#top.solid{background:rgba(250,246,237,.94);box-shadow:0 1px 0 var(--line)}
.mono{display:block;width:50px;height:50px}
.mono img{display:block;width:50px;height:50px}
#top .r{display:flex;gap:8px;align-items:center}
#langb{height:44px;min-width:52px;padding:0 14px;border-radius:22px;border:1px solid rgba(77,93,63,.4);background:var(--cru);font-family:var(--lab);font-size:12px;letter-spacing:.12em}

/* Pintar */
.paint{--p:130%;-webkit-mask-image:linear-gradient(172deg,#000 calc(var(--p) - 28%),transparent var(--p));mask-image:linear-gradient(172deg,#000 calc(var(--p) - 28%),transparent var(--p))}
.paint.wait{--p:0%}
.paint.go{animation:paint 2.4s cubic-bezier(.3,.1,.2,1) both}
@keyframes paint{from{--p:0%}to{--p:130%}}

/* Portada */
main{display:block}
section{position:relative;padding:84px var(--gut) 40px;max-width:760px;margin:0 auto}
#hero{min-height:100svh;padding-top:76px;padding-bottom:28px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;max-width:900px}
.eyebrow{min-height:16px}
.names{font-family:var(--tit);font-style:italic;font-weight:400;font-size:clamp(54px,15.5vw,104px);line-height:1.02}
.names b{font-weight:400;color:var(--ort)}
.art{position:relative;flex:1 1 auto;min-height:320px;margin:0 calc(var(--gut) * -1);will-change:transform}
#artp{position:absolute;inset:0}
.art img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;-webkit-mask-image:linear-gradient(transparent,#000 9%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 9%,#000 90%,transparent)}
.tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse 66% 58% at 50% 52%,var(--tc,#F2954F) 30%,transparent 78%)}
.chip{position:absolute;left:var(--gut);bottom:7%;padding:6px 12px;border-radius:14px;background:rgba(250,246,237,.92);color:var(--ort);opacity:0;transition:opacity .8s 1.6s}
.chip.on{opacity:1}
.info{display:flex;flex-direction:column;gap:14px}
.date{font-weight:500;font-size:27px;line-height:1.15}
.place{font-family:var(--lab);font-size:15px}
.vine{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;font-family:var(--lab);font-size:13px;line-height:1.35}
.vine img{width:34px;height:auto;flex:none}
.vine b{font-weight:500}
.codef{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;height:52px;border-radius:16px;border:1px solid rgba(77,93,63,.45);background:#fff;color:var(--ink);font-family:var(--lab);font-size:18px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.err{font-family:var(--lab);font-size:13px;color:var(--gr);min-height:18px}
.down{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-family:var(--lab);font-size:14px;text-decoration:none}
.down svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.livebig{font-family:var(--tit);font-style:italic;font-size:48px;line-height:1.05}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-weight:500;font-size:20px;line-height:1.15}

/* La viña del margen */
#rail{position:fixed;z-index:20;right:max(4px,env(safe-area-inset-right));top:50%;width:var(--rail);height:min(560px,68vh);transform:translateY(-50%);opacity:0;pointer-events:none;transition:opacity .5s}
#rail.on{opacity:1;pointer-events:auto}
#rail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#rail path{fill:none;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
#rail .bg{stroke:var(--line)}
#rail .fg{stroke:var(--cane,#8E9C74);stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--rp,0))}
#rail a{position:absolute;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;display:flex;align-items:center;justify-content:center;text-decoration:none}
#rail a img{width:30px;height:auto;transform:scale(.3) rotate(var(--r,0deg));opacity:.35;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .4s;filter:saturate(.2)}
#rail a.gr img{transform:scale(var(--ls,1)) rotate(var(--r,0deg));opacity:.85;filter:none}
#rail a.on img{transform:scale(calc(var(--ls,1) * 1.35)) rotate(var(--r,0deg));opacity:1}
#rail a i{position:absolute;right:5px;bottom:7px;width:9px;height:9px;border-radius:50%;background:var(--gr);transform:scale(0);transition:transform .35s .15s}
#rail a.on i{transform:scale(1)}
#rail a span{position:absolute;right:46px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 12px;border-radius:14px;background:var(--vi);color:var(--cru);font-family:var(--lab);font-size:12px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .3s}
#rail a.tip span,#rail a:hover span,#rail a:focus-visible span{opacity:1}

/* Apartados */
#app section{padding-right:calc(var(--gut) + var(--rail) - 10px)}
.hd{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 90ms)}
.in .rv{opacity:1;transform:none}
.orn{display:block;width:min(314px,80%);height:auto;margin-top:30px}

/* La finca */
.vins{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
.vin:first-child{grid-column:1/-1}
.vin{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;text-align:left;font-size:inherit}
.pic{position:relative;aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--cru)}
.pic .paint{position:absolute;inset:0}
.pic .dr{position:absolute;inset:0;background:url(img/acuarela.webp) no-repeat}
.pic .mo{position:absolute;inset:0;background:var(--pap);display:flex;align-items:center;justify-content:center}
.pic .mo img{width:46%;height:auto}
.pic .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.vin.flip .ph{opacity:1}
.pic .dw{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .fl{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:rgba(250,246,237,.94);display:flex;align-items:center;justify-content:center;color:var(--vi)}
.cal{margin-top:34px;padding:18px 14px 14px;border-radius:18px;background:var(--pap);text-align:center}
.calr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;margin-bottom:10px}
.calr img{width:100%;max-width:84px;height:auto;justify-self:center;opacity:.3;filter:saturate(.35);transition:opacity .8s,filter .8s}
.calr img.on{opacity:1;filter:none}
.cal b{font-weight:500}
.vin b{font-weight:500;font-size:23px;line-height:1.1}
.vin span{font-size:18px;line-height:1.2;font-style:italic}

/* El día */
.day{position:relative;padding-left:34px;display:flex;flex-direction:column;gap:30px}
.day svg{position:absolute;left:0;top:0;width:24px;height:100%;overflow:visible}
.day path{fill:none;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.day .bg{stroke:var(--line)}
.day .fg{stroke:var(--ol);stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--dp,0))}
.stp{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:.25;transform:translateX(10px);transition:opacity .6s,transform .6s}
.stp.on{opacity:1;transform:none}
.stp::before{content:'';position:absolute;left:-31px;top:2px;width:22px;height:20px;background:url(img/pampol.webp) center/contain no-repeat;transform:scale(0) rotate(-30deg);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.stp.on::before{transform:scale(1) rotate(0)}
.stp .tx{display:flex;flex-direction:column;gap:2px}
.stp .zt{flex:none;width:84px;height:84px;border-radius:14px;border:1px solid var(--line);object-fit:cover}
.stp .h{font-family:var(--lab);font-size:15px;font-weight:500;letter-spacing:.08em;color:var(--ort)}
.stp b{font-weight:500;font-size:27px;line-height:1.1}
.stp span{font-style:italic;font-size:20px;line-height:1.2}
.stp.now b::after{content:'';display:inline-block;width:10px;height:10px;margin-left:10px;border-radius:50%;background:var(--gr);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.sur{margin-top:28px;font-style:italic;font-size:21px}

/* Confirmar */
.stack{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.crd{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.35)}
.crd .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.crd .tt2{font-weight:500;font-size:23px;line-height:1.1}
.crd .sb{font-family:var(--lab);font-size:13px}
.yn{display:flex;gap:6px;flex:none}
.yn button,.chip2{height:46px;min-width:52px;padding:0 16px;border-radius:23px;border:1px solid rgba(77,93,63,.45);background:transparent;font-family:var(--lab);font-size:15px;transition:background .2s,color .2s}
.yn button[aria-pressed=true],.chip2[aria-pressed=true]{background:var(--vi);border-color:var(--vi);color:var(--cru);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{height:44px;font-size:14px}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid rgba(77,93,63,.45);background:#fff;color:var(--ink);font-family:var(--lab);font-size:16px;line-height:1.4;resize:vertical}
.sw{flex:none;width:56px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center}
.sw span{width:56px;height:32px;border-radius:16px;background:var(--lli);position:relative;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(39,49,31,.3);transition:transform .2s}
.sw[aria-checked=true] span{background:var(--vi)}
.sw[aria-checked=true] i{transform:translateX(24px)}
.ok{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--pap);margin-bottom:18px}
.ok b{display:block;font-weight:500;font-size:22px;line-height:1.1}
.ok span{font-family:var(--lab);font-size:13px}
.sendw{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:center}
.after{display:flex;align-items:center;gap:16px;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.after .rs{position:relative;flex:none;width:84px}
.after .rs img{display:block;width:84px;height:auto}
.after .rs .gr{position:absolute;left:30px;top:52%;width:26px;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.6,.5,1) .4s}
.after .rs.has .gr{transform:scale(1)}
.after div{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.after b{font-weight:500;font-size:23px;line-height:1.1}

/* Regalo */
#regalo{padding-top:76px}
.gift{position:relative;border-radius:22px;background:var(--pap);padding:24px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.gift::after{content:'';position:absolute;right:-18px;top:-14px;width:110px;height:110px;background:url(img/pampol.webp) center/contain no-repeat;opacity:.5;transform:rotate(18deg)}
.gift h2{font-family:var(--tit);font-style:italic;font-weight:400;font-size:44px;line-height:1.05}
.iban{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--cru);border:1px solid var(--line)}
.iban code{font-family:var(--lab);font-size:clamp(13px,3.9vw,17px);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.gift.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(214,163,166,.9)}100%{box-shadow:0 0 0 26px rgba(214,163,166,0)}}

/* Mapa */
.mapw{position:relative;border-radius:16px;border:1px solid var(--line);background:var(--cru);overflow:hidden}
.mapw img{display:block;width:100%;height:auto}
.mapw svg{position:absolute;inset:0;width:100%;height:100%}
.zn{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:opacity .8s,transform .9s cubic-bezier(.3,1.4,.5,1);transition-delay:calc(var(--i,0) * 220ms + 300ms);fill:var(--pr)}
.in .zn{opacity:.5;transform:none}
.mapw[data-sel] .zn{opacity:.1;transition-delay:0s}
.mapw[data-sel="1"] .zn[data-z="1"],.mapw[data-sel="2"] .zn[data-z="2"],.mapw[data-sel="3"] .zn[data-z="3"]{opacity:.5;fill:var(--or)}
.pn circle{fill:var(--cru);stroke:var(--vi);stroke-width:.3}
.pn text{font-family:var(--tit);font-style:italic;font-size:3.6px;text-anchor:middle;fill:var(--ort)}
.pn[data-z="0"] circle{fill:var(--or);stroke:none}.pn[data-z="0"] text{fill:#fff}
.zl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.zl button{min-height:56px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:14px;text-align:left;font-size:19px;line-height:1.15;transition:background .2s,border-color .2s}
.zl button[aria-pressed=true]{background:var(--pap);border-color:var(--vi)}
.zl i{flex:none;width:26px;text-align:center;font-family:var(--tit);font-style:italic;font-size:26px;color:var(--ort)}
.zl b{font-weight:500}
.zl .h{font-family:var(--lab);font-size:12px;letter-spacing:.06em;color:var(--ort);display:block;margin-top:2px}

/* Cómo llegar y dormir */
.steps{display:flex;flex-direction:column;gap:24px;border-left:2px solid var(--ol);padding-left:20px;margin:0 0 26px 6px}
.steps li{display:flex;flex-direction:column;gap:4px}
.steps b{font-weight:500;font-size:25px;line-height:1.1}
.steps p{font-size:19px;line-height:1.3}
.grp{margin-top:26px}
.grp h3{margin-bottom:10px;color:var(--ort)}
.grp ul{display:flex;flex-direction:column;gap:8px}
.grp a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:rgba(255,255,255,.35)}
.grp a b{font-weight:500;font-size:21px;line-height:1.1}
.grp a span{font-family:var(--lab);font-size:12px;text-align:right;flex:none;max-width:45%}

footer{padding:50px var(--gut) 60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
footer img{width:min(520px,100%);height:auto}
footer img.mp{width:116px}
footer div{font-family:var(--tit);font-style:italic;font-size:30px}
.toast{position:fixed;z-index:40;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:12px 20px;border-radius:24px;background:var(--vi);color:var(--cru);font-family:var(--lab);font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
 :root{--gut:40px}
 section{padding-top:110px}
 #hero{padding-top:96px}
 .names br{display:none}
 #hero{text-align:center;align-items:center}
 .art{flex:none;min-height:0;margin:0;width:min(640px,100%)}#artp{position:static}
 .art img{position:static;height:auto;aspect-ratio:1400/934;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
 .chip{left:50%;transform:translateX(-50%);white-space:nowrap}
 .cta,.vine{justify-content:center}.codef{align-items:center;text-align:center}.codef .row{width:min(420px,100%)}
 .mapw,.zl{max-width:460px}
 .info{align-items:center}
 #rail{right:22px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .paint.go,.down svg,.gift.flash{animation:none}.paint.wait{--p:130%}
 .rv,.stp,.zn{transition:none}.rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<header id="top">
  <a class="mono" href="#hero" aria-label="Natalia &amp; Marçal"><img src="img/mono.webp" alt="" width="192" height="192"></a>
  <div class="r"><a class="btn sm" id="navcta" href="#rsvp" hidden></a><button type="button" id="langb"><span id="langt">CA</span></button></div>
</header>
<nav id="rail" aria-label="Apartats"><svg aria-hidden="true" viewBox="0 0 40 600" preserveAspectRatio="none"><path class="bg" pathLength="1" d="M20 0C27 60 13 120 20 180S27 300 20 360S13 480 20 600"/><path class="fg" pathLength="1" d="M20 0C27 60 13 120 20 180S27 300 20 360S13 480 20 600"/></svg><div id="leaves"></div></nav>
<main>
  <section id="hero">
    <div>
      <div class="lab acc eyebrow" id="eyebrow">&nbsp;</div>
      <h1 class="names">Natalia <b>&amp;</b><br> Marçal</h1>
    </div>
    <div class="art" id="art"><div class="paint wait" id="artp"><picture><source media="(min-width:760px)" srcset="img/acuarela.webp"><img src="img/portada.webp" alt="" id="arti"></picture><div class="tint" id="tint"></div></div><span class="lab chip" id="chip"></span></div>
    <div class="info" id="heroB"></div>
  </section>
