<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natalia &amp; Marçal · 3 de juliol de 2027</title>
<meta name="description" content="Dissabte, 3 de juliol de 2027 · Mas de les Moreres, Cornudella de Montsant (Priorat)">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Natalia &amp; Marçal">
<meta property="og:description" content="Dissabte, 3 de juliol de 2027 · Mas de les Moreres, Cornudella de Montsant">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1Rs5YnpCArYb64omxe8YgoyfVj4ox_m7s=w1200">
<meta name="theme-color" content="#0B0F0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F0C;--card:#141A15;--bone:#ECE7DA;--dim:#C9C4B5;--soft:#D8D3C5;--acc:#D4F56A;--ink:#10140A;--line:rgba(236,231,218,.18);--line2:rgba(236,231,218,.35);
--sans:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;--serif:'Instrument Serif','Times New Roman',serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--bone);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--bone)}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.acc{color:var(--acc)}.dim{color:var(--dim)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
[hidden]{display:none!important}

/* barra superior */
.top{position:fixed;z-index:30;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 22px;padding-top:max(14px,env(safe-area-inset-top));transition:background .3s}
.top.solid{background:linear-gradient(180deg,rgba(11,15,12,.92),rgba(11,15,12,0))}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-decoration:none;height:44px;display:flex;align-items:center}
.nav{display:none;gap:26px;font-size:14px}
.nav a{text-decoration:none;height:44px;display:flex;align-items:center;gap:6px;opacity:.9}
.nav a:hover{opacity:1;color:#fff}
.pill{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:rgba(11,15,12,.35);color:var(--bone);font-family:var(--mono);font-size:12px;letter-spacing:.1em;display:flex;align-items:center;gap:8px;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill.cta{display:none;background:var(--acc);border-color:var(--acc);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0}
.top-r{display:flex;gap:10px;align-items:center}

/* índice lateral */
.dots{position:fixed;z-index:25;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dots a{display:flex;align-items:center;justify-content:flex-end;gap:8px;height:22px;min-width:22px;text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.dots a span{opacity:0;transform:translateX(6px);transition:.25s;white-space:nowrap;text-shadow:0 0 8px #0B0F0C,0 0 2px #0B0F0C}
.dots a i{width:5px;height:5px;border-radius:50%;background:var(--bone);opacity:.55;margin-right:2px;transition:.25s}
.dots a.on span{opacity:1;transform:none}
.dots a.on i{width:9px;height:9px;background:var(--acc);opacity:1;margin-right:0}

/* portada */
#hero{position:relative}
.hbg{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.hsp{height:330vh}#hero.solo .hsp{display:none}
.tl{position:absolute;z-index:2;left:22px;right:22px;bottom:34px;opacity:0;transition:opacity .4s;display:flex;flex-direction:column;gap:8px;pointer-events:none;text-shadow:0 1px 14px rgba(11,15,12,.7)}
.tl b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:60px;line-height:.95;letter-spacing:-.01em}
#hscrim{transition:opacity .3s}
.sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;opacity:0;transition:opacity 1.4s ease}
@media (min-aspect-ratio:1/1){.ph{object-position:62% 50%;transform:scale(1.1);transform-origin:62% 100%}}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(11,15,12,.5) 0,rgba(11,15,12,0) 30%,rgba(11,15,12,0) 52%,rgba(11,15,12,.82) 76%,rgba(11,15,12,.97) 100%)}
.hero-in{position:relative;z-index:2;width:100%;margin-top:-100vh;margin-top:-100svh;min-height:100vh;min-height:100svh;padding:86px 22px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:34px}
.hero-in h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(72px,21vw,96px);line-height:.9;letter-spacing:-.01em;margin-top:14px}
.hero-b{display:flex;flex-direction:column;gap:20px;max-width:460px}
.live{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.live i,.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(212,245,106,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(212,245,106,0)}100%{box-shadow:0 0 0 0 rgba(212,245,106,0)}}
.date{font-size:23px;font-weight:500;letter-spacing:-.01em}
.place{font-size:15px;color:var(--dim)}
.count{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(20,26,21,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.count b{font-size:17px;font-weight:500;display:block}
.btn{height:56px;border-radius:28px;border:0;background:var(--acc);color:var(--ink);font-size:17px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{height:52px;background:transparent;border:1px solid var(--line2);color:var(--bone);font-size:15px;font-weight:500}
.link{height:44px;font-size:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;color:var(--bone);width:100%}
.link svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.codef{display:flex;flex-direction:column;gap:10px}
.codef .row{display:flex;gap:8px}
.field{height:56px;width:100%;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:rgba(20,26,21,.85);color:var(--bone);font-size:16px}
.codef .field{font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:18px}
.codef .btn{width:auto;padding:0 26px;flex:none}
.err{color:#FFB199;font-size:14px;min-height:20px}

/* la finca desde el aire (vídeo) */
#vuelo{position:relative;height:230vh}
.vst{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#0B0F0C}
.vst canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vpb{height:3px;border-radius:2px;background:rgba(236,231,218,.22);max-width:240px;margin-top:8px}.vpb i{display:block;height:3px;border-radius:2px;background:var(--acc);width:0}
.vst .scrim{background:linear-gradient(180deg,rgba(11,15,12,.5) 0,rgba(11,15,12,0) 26%,rgba(11,15,12,0) 56%,rgba(11,15,12,.88) 100%)}
.vtx{position:absolute;z-index:2;left:22px;right:22px;bottom:34px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.vtx h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:56px;line-height:.95;letter-spacing:-.01em}
.vtx p{font-size:15px;color:var(--soft)}
@media (min-width:900px){.vtx{left:64px;bottom:56px}.vtx h2{font-size:96px}.vtx p{font-size:17px}}
/* el vuelo */
#dia{position:relative;height:620vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stage .scrim{background:linear-gradient(180deg,rgba(11,15,12,.55) 0,rgba(11,15,12,0) 34%,rgba(11,15,12,0) 60%,rgba(11,15,12,.5) 100%)}
.stops{position:absolute;z-index:3;left:22px;top:78px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.stops button{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.1em;display:flex;align-items:center;gap:10px;height:26px;padding:0;text-shadow:0 0 10px rgba(11,15,12,.8)}
.stops button i{width:5px;height:5px;border-radius:50%;background:currentColor;margin:0 2px;transition:.2s}
.stops .past button{color:var(--dim);opacity:.75}
.stops .next button{color:var(--bone)}
.stops .on button{color:var(--acc);font-weight:500}
.stops .on i{width:9px;height:9px;margin:0}
.fcard{position:absolute;z-index:3;left:16px;right:16px;bottom:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:22px;border:1px solid var(--line);background:rgba(14,19,15,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fcard h2{font-family:var(--serif);font-weight:400;font-size:42px;line-height:.98;letter-spacing:-.01em}
.fcard p{font-size:15px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:rgba(236,231,218,.07)}
.stat b{font-size:16px;font-weight:500}
.sunbar{display:flex;align-items:center;gap:10px}
.sunbar .tr{flex:1;height:3px;border-radius:2px;background:rgba(236,231,218,.2);position:relative}
.sunbar .fl{height:3px;border-radius:2px;background:var(--acc);width:0}
.sunbar .kn{position:absolute;top:-5px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--acc);left:0}
.fswap{transition:opacity .25s}

/* secciones */
section.sec{padding:84px 22px 40px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sec h2.big{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em}
.sec h2.big em{font-style:italic}
.sec h2.huge{font-family:var(--serif);font-style:italic;font-weight:400;font-size:72px;line-height:.92;letter-spacing:-.01em}
.lead{font-size:15px;color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:10px}
.crd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 16px;border-radius:18px;border:1px solid rgba(236,231,218,.16);background:var(--card)}
.crd .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.crd .tt{font-size:19px;font-weight:500;letter-spacing:-.01em}
.crd .sb{font-size:13px;color:var(--dim)}
.yn{display:flex;gap:6px;flex:none}
.yn button{width:54px;height:44px;border-radius:22px;font-size:15px;font-weight:600;background:transparent;color:var(--bone);border:1px solid var(--line2);transition:.15s}
.yn button[aria-pressed=true].y{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.yn button[aria-pressed=true].n{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:8px}
.inp{height:52px;padding:0 16px;border-radius:14px;border:1px solid rgba(236,231,218,.3);background:var(--card);color:var(--bone);font-size:16px;width:100%}
textarea.inp{height:auto;padding:14px 16px;line-height:1.4;resize:none}
.inp::placeholder{color:#A9A496}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:500;background:transparent;color:var(--bone);border:1px solid var(--line2);transition:.15s}
.chip[aria-pressed=true]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600}
.sw{width:56px;height:44px;padding:0;border:0;background:transparent;display:flex;align-items:center;flex:none}
.sw span{width:56px;height:32px;border-radius:16px;padding:3px;display:flex;border:1px solid rgba(236,231,218,.5);transition:.2s}
.sw span i{width:24px;height:24px;border-radius:50%;background:var(--bone);transition:.2s}
.sw[aria-checked=true] span{background:var(--acc);border-color:var(--acc)}
.sw[aria-checked=true] span i{background:var(--ink);transform:translateX(24px)}
.note{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim);text-align:center;text-transform:uppercase}
.ok{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid rgba(236,231,218,.16);background:var(--card)}
.ok b{font-size:16px;font-weight:500;display:block}
.ok span{font-size:13px;color:var(--dim)}

/* mapa */
.mapw{position:relative;width:100%;max-width:390px;margin:0 auto;aspect-ratio:100/198.5}
.mapw>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.pin b{width:28px;height:28px;border-radius:50%;background:var(--bone);color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:.2s}
.pin[aria-pressed=true] b{width:36px;height:36px;background:var(--acc);font-size:12px;box-shadow:0 0 0 6px rgba(14,21,16,.7)}
.pin.nowp b{animation:pulse 2.4s infinite}
.pin.off{opacity:.25}
.mlab{position:absolute;font-family:var(--mono);font-size:11px;letter-spacing:.1em;pointer-events:none;white-space:nowrap}
.mcard{position:absolute;left:0;bottom:0;width:54%;min-width:196px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:10px}
.mcard h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;letter-spacing:-.01em}
.mcard p{font-size:14px;line-height:1.4;color:var(--soft)}
.mcard .btn{height:44px;font-size:14px;margin-top:4px}
.north{position:absolute;right:0;top:6%;display:flex;align-items:center;gap:6px;color:var(--dim)}

/* mesa */
.seal{padding:18px 20px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:8px}
.seal b{font-size:30px;font-weight:500;letter-spacing:-.01em}
.seal span.s{font-size:14px;color:var(--dim)}
.tbl{width:100%;height:auto;display:block}

/* llegar */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{position:relative;padding:0 0 26px 30px}
.steps li:before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.steps li:after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line2)}
.steps li:last-child{padding-bottom:0}.steps li:last-child:after{display:none}
.steps b{display:block;font-size:19px;font-weight:500;letter-spacing:-.01em;margin:4px 0 3px}
.steps p{font-size:14px;color:var(--dim)}

/* dormir */
.grp{display:flex;flex-direction:column;gap:8px}
.grp ul{list-style:none;margin:0;padding:0;border-radius:18px;border:1px solid rgba(236,231,218,.16);background:var(--card);overflow:hidden}
.grp li+li{border-top:1px solid rgba(236,231,218,.1)}
.grp a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 16px;text-decoration:none}
.grp a:hover{background:rgba(236,231,218,.05)}
.grp a b{font-size:16px;font-weight:500}
.grp a span{font-size:13px;color:var(--dim);text-align:right;flex:none}

footer{padding:60px 22px 80px;text-align:center}
footer .serif{font-size:44px;font-style:italic}

.toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--bone);color:var(--ink);padding:12px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:900px){
  .top{padding:18px 40px}
  .nav{display:flex}
  .pill.cta{display:flex}
  .dots{right:26px}
  .hero-in{padding:120px 64px 56px;flex-direction:row;align-items:flex-end;justify-content:space-between}
  .tl{left:64px;bottom:56px}.tl b{font-size:104px}
  .hero-in h1{font-size:clamp(120px,12vw,188px)}
  .hero-b{width:420px;flex:none}
  .stops{left:64px;top:110px}
  .fcard{left:auto;right:64px;bottom:56px;width:400px}
  section.sec{max-width:1120px;padding:120px 64px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px 80px;align-items:start}
  section.sec .col{display:flex;flex-direction:column;gap:26px}
  section.sec .col.stick{position:sticky;top:120px}
  .sec h2.big{font-size:64px}.sec h2.huge{font-size:104px}
  .lead{font-size:17px;max-width:420px}
}
@media (max-width:899px){section.sec .col{display:contents}}
@media (max-width:899px){.dots{right:7px}.dots a span{display:none}.fcard{gap:10px;padding:16px 18px}.fcard h2{font-size:34px}.fcard .stats,.fcard .kp{display:none}}
@media (max-width:899px) and (max-height:740px){.stops{flex-direction:row;gap:6px;align-items:center}.stops li:not(.on) button{font-size:0;gap:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.live i,.pulse,.link svg,.pin.nowp b{animation:none}}
</style>
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="#hero">N&amp;M · 03.07.27</a>
  <nav class="nav" id="nav" aria-label="Principal" hidden></nav>
  <div class="top-r">
    <button type="button" class="pill" id="langb"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langt">CA</span></button>
    <a class="pill cta" id="navcta" href="#rsvp" hidden></a>
  </div>
</header>
<nav class="dots" id="dots" aria-label="Seccions" hidden></nav>

<section id="hero" class="solo">
  <div class="hbg">
    <svg class="sky" id="heroSky" aria-hidden="true" preserveAspectRatio="none"></svg>
    <img class="ph" id="phA" alt="" decoding="async"><img class="ph" id="phB" alt="" decoding="async"><img class="ph" id="phC" alt="" decoding="async"><img class="ph" id="phD" alt="" decoding="async">
    <div class="scrim" id="hscrim"></div>
    <div class="tl" id="tl" aria-hidden="true"></div>
  </div>
  <div class="hero-in">
    <div>
      <span class="mono acc" id="eyebrow">&nbsp;</span>
      <h1>Natalia<br>&amp; Marçal</h1>
    </div>
    <div class="hero-b" id="heroB"></div>
  </div>
  <div class="hsp" id="hsp"></div>
</section>

<main id="app" hidden>
  <section id="vuelo"><div class="vst"><canvas id="vc" aria-hidden="true"></canvas><div class="scrim"></div><div class="vtx" id="vtx"></div></div></section>
  <section id="dia" aria-label="El dia">
    <div class="stage">
      <svg class="sky" id="flySky" aria-hidden="true" preserveAspectRatio="none"></svg>
      <div class="scrim"></div>
      <ol class="stops" id="stops"></ol>
      <div class="fcard" id="fcard" aria-live="polite"></div>
    </div>
  </section>
  <section class="sec" id="rsvp"></section>
  <section class="sec" id="finca"></section>
  <section class="sec" id="mesa"></section>
  <section class="sec" id="llegar"></section>
  <section class="sec" id="dormir"></section>
  <footer><div class="serif">Natalia &amp; Marçal</div><div class="mono dim" style="margin-top:10px">03.07.27 · MAS DE LES MORERES</div></footer>
